<!DOCTYPE html>
<html lang="en-US">
<meta charset="utf-8">
    <head>
        <meta name="description" content="This site was created for training to make an html site for E-commerce-System
        if you want to clone the code see https://github.com/MostafaAhmed-100/E-commerce-System-FrontEnd.git for the frontend
        and if you want to clone the BackEnd code go see https://github.com/MostafaAhmed-100/E-commerce-System-BackEnd.git
        note it was in the master not the main">
        <meta name="author" content="MostafaAhmed-100 githubName">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="../Photos/e-commerce-concept-logo.webp">
        <link rel="stylesheet" href="../H-CSS/style.css">
        <title>Login</title>
    </head>
    <body>
        <header>
            <img src="../Photos/e-commerce-concept-logo.webp" alt="E-commerce Logo" style="width: 100px; float: left; height: 100px;">
            <div>
                <h1>Welcome to Our E-commerce System</h1>
                <p>Your one-stop shop for all your needs!</p>
            </div>
            <div style="margin-top: 15px;">
                <a href="products.html" class="button-link">See Products</a>
                <a href="contact form.html" class="button-link">Contact Us</a>
                <a href="login.html" class="button-link">Login</a>
                <a href="register.html" class="button-link">Register</a>
                <a href="Home.html" class="button-link">Home</a>
            </div>
        </header>
        <main style="flex: 1; display: flex; justify-content: center; align-items: center; background-color: #ecf0f1; padding: 40px 0;">
            <form action="main.html" method="post" id="LoginForm">
                <h1 class="long_text">Please Enter your information</h1>
                <div style="width: 100%;">
                    <label for="Loginemail" class="short_text">Email</label>
                    <input type="email" name="email" id="Loginemail" required>
                </div>
                <div style="width: 100%;">
                    <label for="Loginpassword" class="short_text">Password</label>
                    <input type="password" name="password" id="Loginpassword" required>
                </div>
                <div style="display: flex; gap: 10px; width: 100%;">
                    <button type="submit" class="button-link" style="border: none;">Login</button>
                    <a href="register.html" class="button-link" style="background-color: #34495e;">Register</a>
                </div>
            </form>
        </main>

        <footer>
            <div style="color: #bdc3c7; padding: 15px;">
                <p>2026 - E-Commerce-System-front-end</p>
                <p>Developed by Mostafa Ahmed Soudi</p>
            </div>
        </footer>
        <script src="../H-JavaS/Validation.js"></script>
    </body>
</html>
